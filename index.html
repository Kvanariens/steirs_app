
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Security</title>
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    background: #050a12;
    color: #00ff9d;
    font-family: Consolas, monospace;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
}
.container {
    width: 100%;
    max-width: 600px;
    border: 1px solid #00ff9d;
    padding: 30px;
    box-shadow: 0 0 30px #00ff9d33;
    text-align: center;
}
h1 { font-size: 24px; }
.status { color: #fff; margin: 25px 0; }
.bar {
    height: 12px;
    background: #15251e;
    margin: 20px 0;
}
.progress {
    width: 0%;
    height: 100%;
    background: #00ff9d;
    transition: width .3s;
}
.logs {
    text-align: left;
    font-size: 13px;
    line-height: 2;
    min-height: 130px;
}
.final {
    display: none;
    color: #ff3333;
    font-size: 25px;
    font-weight: bold;
    animation: blink 1s infinite;
}
button {
    background: #00ff9d;
    border: none;
    padding: 14px 25px;
    font-weight: bold;
    cursor: pointer;
    font-size: 16px;
}
@keyframes blink {
    50% { opacity: .4; }
}
</style>
</head>
<body>

<div class="container">
    <h1>⚠ SYSTEM ACCESS TERMINAL</h1>
    <p class="status" id="status">Инициализация системы...</p>

    <div class="bar">
        <div class="progress" id="progress"></div>
    </div>

    <h2 id="percent">0%</h2>

    <div class="logs" id="logs">
        > Ожидание запуска...
    </div>

    <div class="final" id="final">
        <br><br>
        СПАСИБО ЗА ДОСТУП!<br>
        
        <p style="color:white;font-size:15px">
            
        </p>
    </div>

    <button id="start" onclick="start()">НАЧАТЬ ПРОВЕРКУ</button>
</div>

<script>
const steps = [
    "Инициализация системы...",
    "Загрузка данных устройства...",
    "Проверка подключения...",
    "Сканирование фотографий...",
    "Проверка списка контактов...",
    "Анализ сообщений...",
    "Подтверждение доступа...",
    "Завершение операции..."
];

function start() {
    const button = document.getElementById("start");
    const progress = document.getElementById("progress");
    const percent = document.getElementById("percent");
    const status = document.getElementById("status");
    const logs = document.getElementById("logs");
    const final = document.getElementById("final");

    button.style.display = "none";
    logs.innerHTML = "";
    let value = 0;
    let step = 0;

    const timer = setInterval(() => {
        value += Math.floor(Math.random() * 8) + 3;
        if (value > 100) value = 100;

        progress.style.width = value + "%";
        percent.textContent = value + "%";

        let currentStep = Math.min(
            Math.floor(value / 13),
            steps.length - 1
        );

        if (currentStep !== step || value === 100) {
            step = currentStep;
            status.textContent = steps[step];
            logs.innerHTML += "> " + steps[step] + "<br>";
        }

        if (value === 100) {
            clearInterval(timer);
            setTimeout(() => {
                status.textContent = "Проверка завершена!";
                final.style.display = "block";
            }, 1000);
        }
    }, 350);
}
</script>

</body>
</html>
